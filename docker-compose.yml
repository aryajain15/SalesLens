services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: saleslens }
    volumes: ["./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql"]
    ports: ["5432:5432"]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/saleslens
      JWT_SECRET: change-me
      OLLAMA_URL: http://host.docker.internal:11434
    ports: ["4000:4000"]
    depends_on: [db]
